<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEALED BID</title>
<style>
:root{
  /* The two base colours become the LCD backlight tint, not a glow: a
     real liquid-crystal display is dark segments on a pale panel, which
     is why the light theme reads as more authentic than a glowing one.
     --c is set per role by the script and tints the panel. */
  --cyan:#d7f6fa; --pink:#f9d5d0;
  --page:#eceff1;
  --bezel-a:#fbfcfc; --bezel-b:#dfe4e6;
  --ink:#14252a;                       /* lit segments and primary text */
  --ghost:rgba(20,37,42,.085);         /* unlit segments, still faintly there */
  --muted:#7c8b90;
  --hair:rgba(20,37,42,.13);
  --dw:44px; --dh:88px; --st:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #ffffff, transparent 60%),
    var(--page);
  color:var(--muted);
  font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.16em;
  display:grid; place-items:center; padding:26px; -webkit-font-smoothing:antialiased;
}
.wrap{display:flex;flex-direction:column;align-items:center;gap:18px}

/* device: light instrument casing */
.device{
  background:linear-gradient(165deg,var(--bezel-a),var(--bezel-b));
  border-radius:30px;padding:20px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -1px 0 rgba(20,37,42,.07) inset,
    0 1px 2px rgba(20,37,42,.10),
    0 18px 44px rgba(20,37,42,.16);
}
/* the LCD itself, tinted by role and slightly recessed */
.panel{
  background:linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, #ffffff), var(--c));
  border-radius:20px;padding:24px 30px 20px;width:470px;
  box-shadow:
    0 2px 5px rgba(20,37,42,.16) inset,
    0 0 0 1px rgba(20,37,42,.10);
}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:10px}
.role{color:var(--ink);font-weight:600}
.phase{color:rgba(20,37,42,.42)}

/* seven segment: dark ink on the backlight */
.readout{display:flex;justify-content:center;align-items:flex-end;gap:9px;min-height:var(--dh)}
.digit{position:relative;width:var(--dw);height:var(--dh)}
.digit i{position:absolute;display:block;background:var(--ghost)}
.digit i.on{background:var(--ink);box-shadow:0 1px 1px rgba(20,37,42,.18)}
.digit .a,.digit .g,.digit .d{left:calc(var(--st)/2);width:calc(var(--dw) - var(--st));height:var(--st);
  clip-path:polygon(0 50%,14% 0,86% 0,100% 50%,86% 100%,14% 100%)}
.digit .a{top:0} .digit .g{top:calc(50% - var(--st)/2)} .digit .d{bottom:0}
.digit .f,.digit .b,.digit .e,.digit .c{width:var(--st);height:calc(50% - var(--st)/2);
  clip-path:polygon(50% 0,100% 8%,100% 92%,50% 100%,0 92%,0 8%)}
.digit .f{top:calc(var(--st)/2);left:0} .digit .b{top:calc(var(--st)/2);right:0}
.digit .e{bottom:calc(var(--st)/2);left:0} .digit .c{bottom:calc(var(--st)/2);right:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ghost);margin-bottom:7px}
.dot.on{background:var(--ink)}
.unit{text-align:center;margin-top:11px;font-size:10px;color:rgba(20,37,42,.55)}

/* the crypto pipeline, the point of the demo */
.pipe{display:flex;gap:6px;margin-top:22px}
.pipe div{flex:1;text-align:center;font-size:8px;letter-spacing:.1em;padding:7px 2px;border-radius:5px;
  background:rgba(20,37,42,.05);color:rgba(20,37,42,.34);transition:.25s}
.pipe div.on{background:rgba(20,37,42,.86);color:#fff}
.pipe div.busy{background:#c8462f;color:#fff}
.status{text-align:center;margin-top:12px;font-size:9px;color:rgba(20,37,42,.6);min-height:12px}

.peers{display:flex;gap:6px;justify-content:center;margin-top:18px}
.peers i{width:26px;height:5px;border-radius:3px;background:rgba(20,37,42,.11)}
.peers i.seated{background:rgba(20,37,42,.32)}
.peers i.sealed{background:var(--ink)}
.peers i.me{outline:1.5px solid var(--ink);outline-offset:2px}

.keys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:10px;letter-spacing:.15em;
  background:linear-gradient(#ffffff,#e9edef);
  color:#4b5c61;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;min-width:56px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(20,37,42,.16),0 0 0 1px var(--hair)}
button:hover{background:linear-gradient(#ffffff,#f3f6f7)}
button:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(20,37,42,.2) inset}
button.lit{color:var(--ink);box-shadow:0 0 0 1.5px var(--ink),0 1px 2px rgba(20,37,42,.16)}
button.go{background:linear-gradient(#2f7d4f,#256640);color:#fff;box-shadow:0 1px 2px rgba(20,37,42,.24)}
button.no{background:linear-gradient(#c04a3a,#a53a2c);color:#fff;box-shadow:0 1px 2px rgba(20,37,42,.24)}
button:disabled{opacity:.38;cursor:not-allowed;transform:none}

.log{width:510px;font-size:9px;color:var(--muted)}
.log h4{font-weight:400;letter-spacing:.14em;margin-bottom:8px;color:rgba(20,37,42,.45)}
.log table{width:100%;border-collapse:collapse}
.log td{padding:5px 0;border-top:1px solid var(--hair);color:rgba(20,37,42,.72)}
.log .ok{color:#256640;font-weight:600} .log .no{color:#a53a2c}
.log .empty{color:rgba(20,37,42,.3);padding-top:8px;border-top:1px solid var(--hair)}
</style>
</head>
<body>
<div class="wrap">

<div class="device">
  <div class="panel" id="panel" style="--c:#d7f6fa">
    <div class="top">
      <span class="role" id="role">CONNECTING</span>
      <span class="phase" id="phase"></span>
    </div>

    <div class="readout" id="main"></div>
    <div class="unit" id="unit">CT / KWH</div>

    <div class="pipe">
      <div id="p1">KEYS</div>
      <div id="p2">ENCRYPT</div>
      <div id="p3">SEALED</div>
      <div id="p4">ARGMAX</div>
      <div id="p5">OPEN</div>
    </div>
    <div class="status" id="status">LOADING OPENFHE WASM …</div>

    <div class="peers" id="peers"></div>
  </div>
</div>

<div class="keys" id="keys"></div>

<div class="log">
  <h4 id="loghead">SETTLED TRADES</h4>
  <table><tbody id="tlog"><tr><td class="empty">NONE YET</td></tr></tbody></table>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- seven segment ---------- */
const SEG={'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg',
           '6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg','-':'g'};
function paint(el,str){
  el.innerHTML='';
  for(const ch of str){
    if(ch==='.'){const d=document.createElement('div');d.className='dot on';el.appendChild(d);continue;}
    const d=document.createElement('div'); d.className='digit';
    for(const s of ['a','b','c','d','e','f','g']){
      const i=document.createElement('i'); i.className=s;
      if((SEG[ch]||'').includes(s)) i.classList.add('on');
      d.appendChild(i);
    }
    el.appendChild(d);
  }
}
const fmt = v => { let s=Math.abs(v).toFixed(2); return s.length<5?'0'+s:s; };

/* ---------- FHE, in this tab ----------
   OpenFHE 1.5.1 compiled to WebAssembly, driving ARES-core's own C
   wrapper. Ring 16384 / depth 3 is the cheapest parameter set that runs a
   5-way soft-mask argmax at 128-bit security: OpenFHE refuses ring 8192
   outright, and depth 3 is exactly 1 level for the step polynomial plus
   ceil(log2(4)) for the product tree. */
const RING=16384, DEPTH=3, SCALE_MOD=50, FIRST_MOD=60, BATCH=8;
const SHARPEN=[0.5,0.5];   // p(x)=x/2+1/2, the cabs degree-1 comparator
const SPAN=16.0;           // scales bids into the comparator's [-1,1] domain

const b64 = u8 => { let s=''; for(const b of u8) s+=String.fromCharCode(b); return btoa(s); };
const unb64 = s => { const r=atob(s); const u=new Uint8Array(r.length);
                     for(let i=0;i<r.length;i++) u[i]=r.charCodeAt(i); return u; };

const FHE = {
  M:null, S:null, ready:false, err:'',
  why(e){ try{ return this.M&&this.M.getExceptionMessage
    ? this.M.getExceptionMessage(e).filter(Boolean).join(': ') : String(e);}catch(_){return String(e);} },
  async init(step){
    try{
      step('FETCHING WASM');
      await new Promise((res,rej)=>{const s=document.createElement('script');
        s.src='/wasm/pool_wasm.js'; s.onload=res; s.onerror=()=>rej(new Error('fetch failed'));
        document.head.appendChild(s);});
      step('INSTANTIATING');
      this.M=await PoolWasm();
      step('BUILDING CKKS CONTEXT');
      this.S=new this.M.Session(RING,DEPTH,SCALE_MOD,FIRST_MOD,BATCH);
      this.ready=true; return true;
    }catch(e){ this.err=this.why(e); return false; }
  }
};

/* ---------- state ---------- */
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
let me=null, st=null, myBid=8.00, pubKey=null, epochKey=null;

// Each tab keeps only its OWN epoch position. A buyer adds what it paid on
// the trades it won; the seller adds what it took in. Nobody accumulates
// anyone else's figures, which is what makes the aggregate audit meaningful
// rather than decorative.
let myNet=0, myWins=[];
const send=o=>ws.readyState===1&&ws.send(JSON.stringify(o));
const status=s=>$('status').textContent=s;

ws.onmessage=async e=>{
  const m=JSON.parse(e.data);
  if(m.type==='state'){ me=m.you; st=m.state; render(); return; }
  if(!FHE.ready) return;

  try{
    if(m.type==='pubkey'){ pubKey=unb64(m.blob); render(); return; }

    // Sent to exactly one tab. Everyone else only ever sees that a trade
    // settled at some price, with no name attached to it.
    if(m.type==='won'){
      myNet += m.price_ct;
      myWins.push((st?.trades||[]).length);
      status(`YOU WON THIS ROUND AT ${m.price_ct.toFixed(2)} CT, NOBODY ELSE IS TOLD`);
      render(); return;
    }

    // ---- epoch audit ----------------------------------------------
    if(m.type==='epochkey'){
      epochKey=unb64(m.blob);
      // Encrypt this tab's own epoch total and hand over the ciphertext.
      // Buyers are positive (spent), the seller negative (received), so an
      // honest set sums to zero.
      const sign = myRole()==='seller' ? -1 : 1;
      const ct=FHE.S.encrypt(epochKey, new Array(BATCH).fill(sign*myNet/SPAN));
      send({type:'epochtotal', blob:b64(ct)});
      status('EPOCH TOTAL SEALED, YOUR FIGURE STAYS SEALED');
      return;
    }

    if(m.type==='epochsum'){
      // Blind peer: add the ciphertexts. It never learns a single total,
      // its own excepted, and never learns the sum either.
      let acc=unb64(m.blobs[0]);
      for(let i=1;i<m.blobs.length;i++) acc=FHE.S.evalAdd(acc,unb64(m.blobs[i]));
      send({type:'epochsummed', blob:b64(acc)});
      status('EPOCH TOTALS SUMMED UNDER ENCRYPTION');
      return;
    }

    if(m.type==='epochopen'){
      // Seller opens ONLY the sum. No participant total is decrypted, and
      // no settled trade is reopened.
      const net=FHE.S.fuse([FHE.S.partialDecrypt(unb64(m.blob))],1)[0]*SPAN;
      const ok=Math.abs(net)<0.05;
      send({type:'epochresult', price_ct:net, ok});
      status(ok?'BOOKS BALANCE, AGGREGATE OPENED, NO TRADE REPLAYED'
               :`IMBALANCE ${net.toFixed(2)} CT, SOMEONE MISREPORTED`);
      return;
    }

    if(m.type==='evalkey'){
      // This tab evaluates. It imports only the relinearisation key, which
      // permits multiplication and nothing else. It holds no secret key
      // and cannot read a single bid it is about to compare.
      FHE.S.importEvalKey(unb64(m.blob));
      status('EVALUATOR: RELIN KEY IMPORTED, STILL BLIND');
      return;
    }

    if(m.type==='evaluate'){
      status('RUNNING BLIND ARGMAX …');
      await new Promise(r=>setTimeout(r,30));
      const t=performance.now();
      const cts=m.blobs.map(unb64);
      // With one bidder there is nothing to compare, and argmax refuses
      // n < 2. Hand back a mask of 1 so the seller's readout is uniform.
      const masks = cts.length<2
        ? [FHE.S.encrypt(pubKey, new Array(BATCH).fill(1.0))]
        : FHE.S.argmax(cts,SHARPEN);
      send({type:'masks', blobs:masks.map(b64), note:m.note});
      status(`ARGMAX DONE IN ${Math.round(performance.now()-t)}MS, NOTHING WAS DECRYPTED`);
      return;
    }

    if(m.type==='masks'){
      // Seller only. Open the masks to find the winner, then open ONLY
      // that bid. The losing ciphertexts are never decrypted.
      status('OPENING MASKS …');
      await new Promise(r=>setTimeout(r,30));
      const vals=m.blobs.map(b=>FHE.S.fuse([FHE.S.partialDecrypt(unb64(b))],1)[0]);
      const win=vals.indexOf(Math.max(...vals));
      const seats=JSON.parse(m.note||'[]');
      const bids=(m.bids||[]).map(unb64);
      if(!bids[win]) throw new Error('relay sent no ciphertext for the winning seat');
      const price=FHE.S.fuse([FHE.S.partialDecrypt(bids[win])],1)[0]*SPAN;
      send({type:'offer', seat:(seats[win]??win), price_ct:price});
      status('WINNING BID OPENED, LOSING BIDS LEFT SEALED');
      return;
    }
  }catch(err){ status('FHE ERROR: '+FHE.why(err).slice(0,90).toUpperCase()); }
};

function myRole(){ const p=(st?.peers||[]).find(x=>x.id===me); return p?p.role:''; }
function mySeat(){ const p=(st?.peers||[]).find(x=>x.id===me); return p?p.seat:-1; }

/* ---------- actions ---------- */
async function sellerStart(){
  status('GENERATING KEYPAIR IN THIS TAB …');
  await new Promise(r=>setTimeout(r,30));
  const t=performance.now();
  const {pk,evalKey}=FHE.S.singleKeyGen();
  send({type:'keys', blob:b64(pk), note:b64(evalKey)});
  status(`KEYPAIR READY IN ${Math.round(performance.now()-t)}MS, SECRET KEY NEVER LEAVES`);
}

async function epochStart(){
  status('OPENING EPOCH AUDIT …');
  await new Promise(r=>setTimeout(r,30));
  const {pk}=FHE.S.singleKeyGen();
  send({type:'epochopen', blob:b64(pk)});
}

async function sealBid(){
  if(!pubKey){ status('WAITING FOR SELLER KEY'); return; }
  status('ENCRYPTING BID IN THIS TAB …');
  await new Promise(r=>setTimeout(r,30));
  const t=performance.now();
  const ct=FHE.S.encrypt(pubKey, new Array(BATCH).fill(myBid/SPAN));
  send({type:'bid', blob:b64(ct)});
  status(`SEALED IN ${Math.round(performance.now()-t)}MS, PLAINTEXT NEVER LEFT`);
}

/* ---------- render ---------- */
function render(){
  try{ renderInner(); }
  catch(e){
    // A silent render failure looks exactly like 'the demo is stuck'.
    console.error('render:', e);
    status('UI ERROR: '+String(e.message||e).slice(0,80).toUpperCase());
  }
}
function renderInner(){
  if(!st) return;
  const role=myRole(), phase=st.phase, seat=mySeat();
  const seller=role==='seller';
  // A literal colour, not var(--pink): color-mix() resolving a custom
  // property that itself holds another var() is needlessly fragile.
  $('panel').style.setProperty('--c', seller ? '#f9d5d0' : '#d7f6fa');
  $('role').textContent = role==='seller' ? 'SELLER'
    : role==='buyer' ? `BUYER ${seat+1}` : 'COHORT FULL, OBSERVING';
  $('phase').textContent = phase.toUpperCase();

  // main readout
  const last=(st.trades||[])[0];
  if(phase==='settled' && last){
    paint($('main'),fmt(last.price_ct));
    $('unit').textContent = last.accepted
      ? (seller?'SOLD':(last.seat===seat?'YOU BOUGHT':'SOLD TO ANOTHER'))
      : 'DECLINED';
  }
  else if(seller && st.winner_seat>=0){ paint($('main'),fmt(st.price_ct)); $('unit').textContent='OFFERED TO YOU'; }
  else if(!seller && st.winner_seat>=0){
    paint($('main'), st.winner_seat===seat?fmt(st.price_ct):'--.--');
    $('unit').textContent = st.winner_seat===seat?'YOU WON':'NOT YOU';
  }
  else if(seller){ paint($('main'),fmt(st.band.SpotCt)); $('unit').textContent='GRID SPOT'; }
  else { paint($('main'),fmt(myBid)); $('unit').textContent='YOUR BID'; }

  // pipeline lamps
  const on=(id,c)=>{$(id).className=c||''};
  on('p1', st.has_keys?'on':'');
  on('p2', st.has_keys&&!seller?'on':'');
  on('p3', st.sealed>0?'on':'');
  on('p4', phase==='evaluating'?'busy':(st.winner_seat>=0?'on':''));
  on('p5', st.winner_seat>=0?'on':'');

  // peers strip
  const ps=$('peers'); ps.innerHTML='';
  for(let i=0;i<st.max_buyers;i++){
    const b=(st.peers||[]).find(p=>p.role==='buyer'&&p.seat===i);
    const el=document.createElement('i');
    el.className=(b?(b.sealed?'sealed':'seated'):'')+(b&&b.id===me?' me':'');
    ps.appendChild(el);
  }

  // keys
  const K=$('keys'); K.innerHTML='';
  const key=(label,fn,cls)=>{const b=document.createElement('button');
    b.textContent=label; b.onclick=fn; if(cls)b.className=cls; K.appendChild(b); return b;};

  if(!FHE.ready){ key('LOADING…',()=>{}).disabled=true; }
  else if(seller){
    // One control, not two. Starting a round from 'settled' used to need
    // a separate reset first, which is an easy step to miss and leaves the
    // seller looking stuck.
    if(phase==='waiting'||phase==='settled'){
      const b=key(phase==='settled'?'NEW ROUND':'START ROUND', sellerStart);
      b.disabled = st.buyers===0;
      if(st.buyers===0) status('WAITING FOR BUYERS TO JOIN');
    }
    if(phase==='offer'&&st.winner_seat>=0){
      key('ACCEPT',()=>{ myNet+=st.price_ct;
        send({type:'settle',ok:true,price_ct:st.price_ct}); },'go');
      key('DECLINE',()=>send({type:'settle',ok:false}),'no');
    }
    // Enough trades have settled to audit the books in aggregate.
    if(st.epoch==='ready') key('CLEAR EPOCH', epochStart, 'go');
    if(st.epoch==='done')  key('NEW EPOCH', ()=>{ myNet=0; myWins=[];
        send({type:'newepoch'}); });
  }else if(role==='buyer'){
    if(phase==='bidding'){
      key('BID −',()=>{myBid=Math.max(0.25,+(myBid-0.25).toFixed(2));render();});
      key('BID +',()=>{myBid=Math.min(15.75,+(myBid+0.25).toFixed(2));render();});
      const s=key('SEAL BID', sealBid); s.disabled=!pubKey||seatSealed();
      if(seatSealed()) s.classList.add('lit');
    }
  }

  // epoch heading carries the audit state
  const ep=st.epoch, done=(st.trades||[]).length;
  $('loghead').innerHTML = ep==='done'
    ? (st.epoch_ok
        ? `EPOCH AUDITED · BOOKS BALANCE · NET ${st.epoch_net.toFixed(2)} CT`
        : `EPOCH AUDITED · IMBALANCE ${st.epoch_net.toFixed(2)} CT`)
    : ep==='audit' ? `EPOCH AUDIT · ${st.epoch_have} OF ${(st.peers||[]).length} TOTALS SEALED`
    : `SETTLED TRADES · ${done} OF ${st.epoch_size}`;

  // trade log
  const tb=$('tlog');
  if(!st.trades||!st.trades.length){ tb.innerHTML='<tr><td class="empty">NONE YET</td></tr>'; }
  else{
    // No winner column: the log names nobody. A tab marks its own rows
    // because it was told privately, not because the log says so.
    const n=st.trades.length;
    tb.innerHTML=st.trades.map((t,i)=>{
      const mine=myWins.includes(n-1-i);
      return `<tr><td>${t.at}</td><td>SLOT ${String(t.slot).padStart(2,'0')}:00</td>`+
      `<td>${t.price_ct.toFixed(2)} CT</td>`+
      `<td>${t.bidders} SEALED BIDS</td>`+
      `<td class="${t.accepted?'ok':'no'}">${t.accepted?'CLEARED':'DECLINED'}</td>`+
      `<td>${mine?'YOU':'&nbsp;'}</td></tr>`;
    }).join('');
  }
}
function seatSealed(){ const p=(st?.peers||[]).find(x=>x.id===me); return !!(p&&p.sealed); }

paint($('main'),'00.00');
FHE.init(status).then(ok=>{
  status(ok?'IN-TAB FHE READY · OPENFHE VIA WEBASSEMBLY'
           :'WASM FAILED: '+(FHE.err||'unknown').slice(0,90).toUpperCase());
  render();
});
</script>
</body>
</html>
