<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METER</title>
<style>
:root{
  --cyan:#d7f6fa;
  --pink:#f9d5d0;
  --page:#0f0f18;
  --bezel-a:#34343a;
  --bezel-b:#222226;
  --panel:#08080a;
  --ghost:rgba(215,246,250,.045);

  --dw:38px;            /* digit width  */
  --dh:76px;            /* digit height */
  --st:8px;             /* segment thickness */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--page);
  display:grid;place-items:center;
  padding:28px;
  font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.18em;
  color:#4a4a55;
  -webkit-font-smoothing:antialiased;
}

/* ---------- device ---------- */
.device{
  background:linear-gradient(160deg,var(--bezel-a),var(--bezel-b));
  border-radius:30px;
  padding:20px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.07) inset,
    0 -1px 0 rgba(0,0,0,.5) inset,
    0 30px 70px rgba(0,0,0,.65);
}
.panel{
  background:var(--panel);
  border-radius:20px;
  padding:26px 30px 22px;
  min-width:440px;
  box-shadow:
    0 3px 14px rgba(0,0,0,.9) inset,
    0 0 0 1px rgba(0,0,0,.9);
}

/* ---------- annunciators ---------- */
.ann{display:flex;gap:18px;justify-content:center;margin-bottom:20px}
.ann span{
  color:var(--ghost);
  transition:color .18s,text-shadow .18s;
  font-size:10px;
}
.ann span.on{color:var(--c);text-shadow:0 0 8px var(--c),0 0 20px var(--c)}

/* ---------- seven segment ---------- */
.readout{display:flex;justify-content:center;align-items:flex-end;gap:8px}
.digit{position:relative;width:var(--dw);height:var(--dh)}
.digit i{
  position:absolute;display:block;
  background:var(--ghost);
  transition:background .1s,box-shadow .1s;
}
.digit i.on{
  background:var(--c);
  box-shadow:0 0 6px var(--c),0 0 16px var(--c),0 0 34px var(--c);
}
/* horizontals */
.digit .a,.digit .g,.digit .d{
  left:calc(var(--st)/2); width:calc(var(--dw) - var(--st)); height:var(--st);
  clip-path:polygon(0 50%, 14% 0, 86% 0, 100% 50%, 86% 100%, 14% 100%);
}
.digit .a{top:0}
.digit .g{top:calc(50% - var(--st)/2)}
.digit .d{bottom:0}
/* verticals */
.digit .f,.digit .b,.digit .e,.digit .c{
  width:var(--st); height:calc(50% - var(--st)/2);
  clip-path:polygon(50% 0, 100% 8%, 100% 92%, 50% 100%, 0 92%, 0 8%);
}
.digit .f{top:calc(var(--st)/2); left:0}
.digit .b{top:calc(var(--st)/2); right:0}
.digit .e{bottom:calc(var(--st)/2); left:0}
.digit .c{bottom:calc(var(--st)/2); right:0}
/* separators */
.dot{width:9px;height:9px;border-radius:50%;background:var(--ghost);margin-bottom:6px}
.dot.on{background:var(--c);box-shadow:0 0 6px var(--c),0 0 16px var(--c)}
.colon{display:flex;flex-direction:column;justify-content:center;gap:16px;height:var(--dh);padding:0 2px}
.colon i{width:8px;height:8px;border-radius:50%;background:var(--ghost)}
.colon.on i{background:var(--c);box-shadow:0 0 6px var(--c),0 0 14px var(--c)}
.neg{width:18px;height:var(--st);align-self:center;margin-bottom:calc(var(--dh)/2 - var(--st)/2);
     background:var(--ghost);clip-path:polygon(0 50%,20% 0,80% 0,100% 50%,80% 100%,20% 100%)}
.neg.on{background:var(--c);box-shadow:0 0 6px var(--c),0 0 16px var(--c)}

.unit{text-align:center;margin-top:12px;font-size:10px;color:var(--ghost)}
.unit.on{color:var(--c);opacity:.55;text-shadow:0 0 10px var(--c)}

/* ---------- small readouts ---------- */
.subs{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin-top:24px}
.sub{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sub b{font-weight:400;font-size:9px;color:#3c3c46}
.sub .val{font-size:14px;letter-spacing:.1em;color:var(--c);opacity:.75;text-shadow:0 0 9px var(--c)}
.sub .val.dim{color:#3c3c46;opacity:1;text-shadow:none}

/* ---------- price ladder ---------- */
.ladder{display:flex;gap:1px;margin-top:22px;height:26px;align-items:flex-end}
.ladder i{flex:1;background:var(--ghost);height:4px;transition:height .12s,background .12s}
.ladder i.s{background:rgba(249,213,208,.5);height:12px}
.ladder i.d{background:rgba(215,246,250,.5);height:12px}
.ladder i.b{background:rgba(215,246,250,.28);height:8px}
.ladder i.x{background:#fff;height:26px;box-shadow:0 0 8px #fff,0 0 20px var(--c)}
.laddercap{display:flex;justify-content:space-between;margin-top:7px;font-size:9px;color:#33333c}

/* ---------- keys ---------- */
.keys{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
button{
  font:inherit;font-size:10px;letter-spacing:.16em;
  background:linear-gradient(#2b2b31,#1e1e23);
  color:#7a7a88;border:0;border-radius:8px;
  padding:11px 14px;cursor:pointer;min-width:46px;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 5px rgba(0,0,0,.55);
}
button:active{transform:translateY(1px);box-shadow:0 1px 4px rgba(0,0,0,.7) inset}
button.lit{color:var(--c);text-shadow:0 0 10px var(--c)}
button.wide{min-width:104px}
button:disabled{opacity:.35;cursor:not-allowed}
.caption{text-align:center;margin-top:16px;font-size:9px;color:#33333c;line-height:1.9}
.caption em{font-style:normal;color:#555563}
</style>
</head>
<body>

<div class="device">
  <div class="panel" id="panel" style="--c:var(--pink)">

    <div class="ann">
      <span id="aSell">SELL</span>
      <span id="aBuy">BUY</span>
      <span id="aSealed">SEALED</span>
      <span id="aCleared">CLEARED</span>
      <span id="aSim">SIM</span>
    </div>

    <div class="readout" id="main"></div>
    <div class="unit" id="unit">CT / KWH</div>

    <div class="ladder" id="ladder"></div>
    <div class="laddercap"><span>0.00</span><span id="ladMid">PRICE LADDER</span><span>15.75</span></div>

    <div class="subs">
      <div class="sub"><b>HOUR</b><span class="val" id="vHour">--</span></div>
      <div class="sub"><b>SPOT</b><span class="val" id="vSpot">--</span></div>
      <div class="sub"><b>YOUR BID</b><span class="val" id="vBid">--</span></div>
      <div class="sub"><b>QTY KWH</b><span class="val" id="vQty">--</span></div>
      <div class="sub"><b>SOLAR</b><span class="val" id="vPv">--</span></div>
      <div class="sub"><b>PEERS</b><span class="val" id="vPeers">--</span></div>
    </div>

  </div>
</div>

<div class="keys">
  <button id="kSell">SELL</button>
  <button id="kBuy">BUY</button>
  <button id="kHourD">HR −</button>
  <button id="kHourU">HR +</button>
  <button id="kPxD">BID −</button>
  <button id="kPxU">BID +</button>
  <button id="kQtyD">QTY −</button>
  <button id="kQtyU">QTY +</button>
  <button id="kSeal" class="wide">SEAL</button>
  <button id="kRun" class="wide">CLEAR</button>
</div>

<div class="caption">
  ONE TAB · ONE PARTICIPANT · BID SEALED BEFORE IT LEAVES<br>
  <em id="capNote">REAL DE-LU DAY-AHEAD · 2024-05-12</em>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- seven-segment rendering ---------- */
const SEG = {
  '0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg',
  '6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''
};
function mkDigit(){
  const d = document.createElement('div');
  d.className='digit';
  for(const s of ['a','b','c','d','e','f','g']){
    const i=document.createElement('i'); i.className=s; d.appendChild(i);
  }
  return d;
}
// Render "-12.34" style strings into a container of digits + dot.
function paint(el, str){
  el.innerHTML='';
  let neg=false;
  if(str.startsWith('-')){ neg=true; str=str.slice(1); }
  if(neg){ const n=document.createElement('div'); n.className='neg on'; el.appendChild(n); }
  for(const ch of str){
    if(ch==='.'){
      const dot=document.createElement('div'); dot.className='dot on'; el.appendChild(dot); continue;
    }
    const d=mkDigit(); el.appendChild(d);
    const on=SEG[ch]||'';
    for(const s of on) d.querySelector('.'+s).classList.add('on');
  }
}
const pad=(v,w)=>{ let s=v.toFixed(2); while(s.replace('.','').replace('-','').length<w) s='0'+s; return s; };

/* ---------- crypto seam ----------
   Replaced by the WASM module once OpenFHE is built for the browser.
   Until then the server holds this seam; the annunciator says SIM. */
const Crypto = {
  mode: 'server',
  ready: false,
  async init(){ /* wasm loader lands here */ return false; }
};

/* ---------- state ---------- */
const ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
let me=null, st=null, side='seller', bid=6.0, qty=5.0;

ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if(m.type!=='state') return;
  me=m.you; st=m.state;
  const p=(st.participants||[]).find(x=>x.id===me);
  if(p){ side=p.side; if(p.submitted){ bid=p.price_ct; qty=p.quantity_kwh; } }
  render();
};
const send = o => ws.readyState===1 && ws.send(JSON.stringify(o));

$('kSell').onclick = ()=>{ side='seller'; send({type:'side',side:'seller'}); render(); };
$('kBuy').onclick  = ()=>{ side='buyer';  send({type:'side',side:'buyer'});  render(); };
$('kHourD').onclick= ()=> send({type:'hour',hour:(st.hour+23)%24});
$('kHourU').onclick= ()=> send({type:'hour',hour:(st.hour+1)%24});
$('kPxD').onclick  = ()=>{ bid=Math.max(0.25,+(bid-0.25).toFixed(2)); render(); };
$('kPxU').onclick  = ()=>{ bid=Math.min(15.75,+(bid+0.25).toFixed(2)); render(); };
$('kQtyD').onclick = ()=>{ qty=Math.max(0,+(qty-0.5).toFixed(1)); render(); };
$('kQtyU').onclick = ()=>{ qty=Math.min(20,+(qty+0.5).toFixed(1)); render(); };
$('kSeal').onclick = ()=> send({type:'offer',price_ct:bid,quantity_kwh:qty});
$('kRun').onclick  = ()=>{ $('kRun').disabled=true; send({type:'clear'}); };

/* ---------- ladder ---------- */
function ladder(o){
  const el=$('ladder'); el.innerHTML='';
  const n = st ? st.grid.num_buckets : 64;
  const tick = st ? st.grid.tick_ct : 0.25;
  const S=(o&&o.supply_curve)||[], D=(o&&o.demand_curve)||[];
  const kx = o&&o.did_clear ? Math.round(o.cleared_px/tick) : -1;
  const lo = o ? Math.round(o.floor_ct/tick) : -1;
  const hi = o ? Math.round(o.cap_ct/tick) : -1;
  for(let k=0;k<n;k++){
    const i=document.createElement('i');
    if(k===kx) i.className='x';
    else if(k===lo||k===hi) i.className='b';
    else if(S[k]>0 && D[k]>0) i.className='d';
    else if(S[k]>0) i.className='s';
    else if(D[k]>0) i.className='d';
    el.appendChild(i);
  }
}

/* ---------- render ---------- */
function render(){
  if(!st) return;
  const b=st.band, o=st.outcome;
  const p=(st.participants||[]).find(x=>x.id===me)||{};

  // colour follows the side you are on
  $('panel').style.setProperty('--c', side==='seller' ? 'var(--pink)' : 'var(--cyan)');

  // main readout: your outcome if cleared, else the clearing price, else your meter
  let mainVal, unit;
  if(o && o.did_clear && p.cleared){ mainVal=p.settled_ct/100; unit='EURO SETTLED'; }
  else if(o && o.did_clear){ mainVal=o.cleared_px; unit='CT / KWH CLEARED'; }
  else { mainVal=b.SpotCt; unit='CT / KWH SPOT'; }
  paint($('main'), pad(mainVal, 4));
  $('unit').textContent=unit;
  $('unit').className='unit on';

  // annunciators
  $('aSell').classList.toggle('on', side==='seller');
  $('aBuy').classList.toggle('on', side==='buyer');
  $('aSealed').classList.toggle('on', !!p.submitted);
  $('aCleared').classList.toggle('on', !!(o&&o.did_clear));
  $('aSim').classList.toggle('on', Crypto.mode!=='wasm');

  // sub readouts
  $('vHour').textContent = String(b.Hour).padStart(2,'0')+':00';
  $('vSpot').textContent = b.SpotCt.toFixed(2);
  $('vBid').textContent  = bid.toFixed(2);
  $('vQty').textContent  = qty.toFixed(1);
  $('vPv').textContent   = Math.round(b.PVFraction*100)+'%';
  $('vPeers').textContent= (st.participants||[]).length;

  $('kSell').classList.toggle('lit', side==='seller');
  $('kBuy').classList.toggle('lit', side==='buyer');
  $('kSeal').classList.toggle('lit', !!p.submitted);
  $('kRun').disabled=false;

  $('ladMid').textContent = o
    ? (o.did_clear ? 'CLEARED '+o.cleared_px.toFixed(2) : (o.note||'').toUpperCase())
    : 'PRICE LADDER';

  $('capNote').textContent = Crypto.mode==='wasm'
    ? 'ENCRYPTED IN THIS TAB · WASM'
    : 'REAL DE-LU DAY-AHEAD 2024-05-12 · SIM = ENCRYPTION NOT YET IN-TAB';

  ladder(o);
}

paint($('main'),'00.00');
ladder(null);
Crypto.init().then(ok=>{ if(ok) Crypto.mode='wasm'; render(); });
</script>
</body>
</html>
